# BilibiliAnalysis 插件配置

# 图片显示配置
analysis_display_image: true  # 是否显示封面图片
analysis_display_image_list: ["video", "bangumi", "live", "article", "dynamic"]  # 哪些类型需要显示封面

# 图片大小调整
analysis_images_size: ""  # 当图片大小超过下值时，修改图片大小，不填则发送原图，example: 100h / 100w / 100h_100w
analysis_cover_images_size: ""  # 封面图大小，和上面相同，视频、直播、番剧 封面图使用这个大小

# 黑白名单配置
analysis_whitelist: []  # 只解析里面填写的QQ号发的链接 List[int | str]
analysis_group_whitelist: []  # 只解析里面填写的QQ群号发的链接 List[int | str]
# 填了任何一个白名单后，黑名单失效
analysis_blacklist: []  # 不解析里面填写的QQ号发的链接 List[int | str]
analysis_group_blacklist: []  # 不解析里面填写的QQ群号发的链接 List[int | str]

# 其他配置
analysis_desc_blacklist: []  # 里面填写的群号，发送的解析内容不包含简介 List[int | str]
analysis_reanalysis_time: 0  # 同一个视频重新解析时间，单位秒，0为不重新解析，example: 60 （设置为 0 的时候只记录上一个，大于 0 时记录多个链接）
analysis_enable_search: false  # 是否开启搜视频功能 true/false  example: "搜视频 123456"
analysis_trust_env: false  # 是否使用环境变量或者当前系统正在使用中的代理设置 true/false
