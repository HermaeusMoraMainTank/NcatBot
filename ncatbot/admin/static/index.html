<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NcatBot 管理工作台</title>
<style>
:root{--ink:#20252b;--muted:#69727b;--paper:#f4f1ea;--panel:#fffdf8;--line:#ddd8cc;--nav:#202832;--nav2:#2d3945;--accent:#b64d35;--ok:#2e7d5b;--bad:#b13d3d;--shadow:0 2px 12px #1f293708}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:var(--paper)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:3px;color:var(--ink)}button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--bad);border-color:#d7a5a5}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.app{display:flex;min-height:100vh}.side{width:220px;background:var(--nav);color:#e9edf0;padding:22px 14px;flex:none}.brand{padding:0 12px 24px;border-bottom:1px solid #ffffff1a}.brand strong{font-size:18px;letter-spacing:1px}.brand small{display:block;color:#aeb8c1;margin-top:5px}.nav{padding-top:18px}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#bdc7cf;padding:10px 12px;margin:3px 0}.nav button.active,.nav button:hover{background:var(--nav2);color:#fff}.content{min-width:0;flex:1}.top{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px}.top h1{font-size:17px;margin:0;font-weight:600}.status{display:flex;align-items:center;gap:7px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--bad)}main{padding:24px 26px;max-width:1500px;margin:auto}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:15px}.card label{display:block;color:var(--muted);font-size:12px}.card b{display:block;font-size:22px;margin-top:5px}.card small{color:var(--muted)}.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{border:1px solid var(--line);background:#fffdfb;padding:7px 8px;border-radius:3px;min-width:0}.toolbar input{min-width:220px}table{width:100%;border-collapse:collapse;background:var(--panel)}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top}th{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{background:#faf6ed}.table-wrap{overflow:auto;border:1px solid var(--line)}.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--muted);margin:1px 3px 1px 0;font-size:11px}.pill{font-size:11px;padding:2px 6px;border-radius:2px;background:#eee;color:#555}.pill.ok{background:#e4f1e9;color:var(--ok)}.pill.bad{background:#f8e7e7;color:var(--bad)}.detail{margin-top:16px}.detail h3{margin:0 0 12px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field textarea{width:100%}.field textarea{min-height:74px;resize:vertical}.actions{display:flex;gap:8px;margin-top:13px}.pre{white-space:pre-wrap;word-break:break-word;background:#f1eee7;border:1px solid var(--line);padding:10px;max-height:310px;overflow:auto}.run-detail{display:grid;grid-template-columns:1fr 1fr;gap:15px}.timeline{border-left:2px solid var(--line);padding-left:14px}.step{margin:0 0 13px;position:relative}.step:before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--ok)}.step.fail:before{background:var(--bad)}.transcript{max-height:460px;overflow:auto}.message{padding:8px;border-bottom:1px solid var(--line)}.message .role{font-weight:600;color:var(--accent)}.empty{padding:25px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:5px;margin-bottom:12px}.tabs button.active{background:var(--nav);color:white}.toast{position:fixed;right:22px;bottom:22px;z-index:20;background:#273039;color:white;padding:10px 15px;border-radius:3px;box-shadow:0 4px 18px #0003;display:none}.toast.show{display:block}.overlay{display:none;position:fixed;inset:0;background:#17202be8;z-index:30;align-items:center;justify-content:center}.overlay.show{display:flex}.login{width:min(410px,calc(100% - 32px));background:var(--panel);padding:24px;border-radius:4px}.login h2{margin:0 0 5px}.login p{color:var(--muted)}.login input{width:100%;padding:10px;border:1px solid var(--line);margin:10px 0}.login button{width:100%}.switch{position:relative;display:inline-block;width:34px;height:19px;vertical-align:middle}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#b8b8b8;border-radius:20px}.slider:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:white;border-radius:50%;transition:.15s}.switch input:checked+.slider{background:var(--ok)}.switch input:checked+.slider:before{transform:translateX(15px)}.spinner{width:15px;height:15px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-3px}@keyframes spin{to{transform:rotate(360deg)}}.inline{display:inline-flex;align-items:center;gap:6px}.subhead{font-weight:600;margin:14px 0 7px}.metric{font-size:12px;color:var(--muted)}
@media(max-width:900px){.app{display:block}.side{width:100%;padding:10px 12px;display:flex;align-items:center}.brand{padding:0;border:0;flex:1}.brand small{display:none}.nav{padding:0;display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto;margin:0 2px;padding:8px}.top{padding:0 15px}main{padding:16px 12px}.grid2,.run-detail{grid-template-columns:1fr}.side .brand strong{font-size:15px}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><strong>NcatBot</strong><small>管理工作台</small></div><nav class="nav" id="nav"></nav></aside><div class="content"><header class="top"><h1 id="title">总览</h1><div class="status"><i class="dot" id="statusDot"></i><span id="statusText">已连接</span></div></header><main>
<section class="view" id="view-overview"></section><section class="view" id="view-plugins"></section><section class="view" id="view-skills"></section><section class="view" id="view-agent"></section><section class="view" id="view-audit"></section>
</main></div></div><div class="toast" id="toast"></div><div class="overlay" id="loginOverlay"><form class="login" id="loginForm"><h2>管理后台登录</h2><p>请输入服务器管理令牌。</p><input id="tokenInput" type="password" autocomplete="off" placeholder="Bearer token"><button class="primary" type="submit">进入工作台</button></form></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={token:localStorage.getItem('ncatbot_admin_token')||new URLSearchParams(location.search).get('token')||'',route:location.hash.slice(1)||'overview',plugin:null,skill:null,run:null,skills:[],runs:[],auditTab:'skills',poll:null};
if(state.token)localStorage.setItem('ncatbot_admin_token',state.token);
const routes={overview:'总览',plugins:'插件',skills:'技能',agent:'Agent',audit:'审计'};
function toast(msg,bad=false){const el=$('#toast');el.textContent=msg;el.style.background=bad?'#9d3737':'#273039';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function showLogin(){ $('#loginOverlay').classList.add('show'); $('#tokenInput').value=state.token; $('#tokenInput').focus(); $('#statusDot').classList.add('off');$('#statusText').textContent='未连接'}
function hideLogin(){ $('#loginOverlay').classList.remove('show');$('#statusDot').classList.remove('off');$('#statusText').textContent='已连接'}
async function api(path,opts={}){const headers=Object.assign({'Accept':'application/json','Authorization':'Bearer '+state.token},opts.body?{'Content-Type':'application/json'}:{},opts.headers||{});const res=await fetch(path,Object.assign({},opts,{headers}));if(res.status===401){showLogin();throw new Error('未授权')}let body;try{body=await res.json()}catch(e){throw new Error('服务器返回无效数据')}if(!body.ok)throw new Error(body.error||'请求失败');return body.data}
function setView(){clearInterval(state.poll);state.poll=null;const r=routes[state.route]?state.route:'overview';state.route=r;location.hash=r;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#view-'+r).classList.add('active');$('#title').textContent=routes[r];document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.route===r));({overview:loadOverview,plugins:loadPlugins,skills:loadSkills,agent:loadAgent,audit:loadAudit}[r]||loadOverview)()}
function initNav(){Object.entries(routes).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v;b.dataset.route=k;b.onclick=()=>{state.route=k;setView()};$('#nav').appendChild(b)});window.onhashchange=()=>{state.route=location.hash.slice(1)||'overview';setView()}}
function card(label,value,sub=''){return '<div class="card"><label>'+esc(label)+'</label><b>'+esc(value)+'</b><small>'+esc(sub)+'</small></div>'}
async function loadOverview(){const v=$('#view-overview');v.innerHTML='<div class="empty">加载中…</div>';try{const d=await api('/api/overview');v.innerHTML='<div class="cards">'+card('Bot UIN',d.bot_uin,'运行 '+fmtTime(d.uptime_seconds))+card('平台',Array.isArray(d.platforms)?d.platforms.length:0,(d.platforms||[]).join('、'))+card('插件',d.plugins.loaded+'/'+d.plugins.indexed,'已加载 / 已索引')+card('技能',d.skills.total,d.skills.enabled+' 个启用')+card('技能调用',d.skills.calls,'错误 '+d.skills.errors)+card('运行中',d.runs.active,'总计 '+d.runs.total)+card('沙箱后端',d.sandbox&&d.sandbox.backend||'—',d.sandbox&&d.sandbox.root||'')+'</div><div class="grid2"><div class="panel"><h2 class="section-title">最近运行</h2><div id="recentRuns"></div></div><div class="panel"><h2 class="section-title">平台与服务</h2><div class="subhead">平台</div><div>'+esc((d.platforms||[]).join('、')||'无')+'</div><div class="subhead">沙箱</div><div class="pre">'+esc(JSON.stringify(d.sandbox||{},null,2))+'</div></div></div>';const recent=await api('/api/runs?limit=8');renderRuns(recent, '#recentRuns', true)}catch(e){v.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
function fmtTime(s){s=Number(s)||0;return Math.floor(s/86400)+'天 '+Math.floor(s%86400/3600)+'时 '+Math.floor(s%3600/60)+'分'}
function fmtDate(v){if(!v)return '—';const n=Number(v);return new Date((n>1e12?n:n*1000)).toLocaleString('zh-CN')}
function renderRuns(rows,target,compact=false){const el=$(target);if(!el)return;const data=rows||[];if(!data.length){el.innerHTML='<div class="empty">暂无运行记录</div>';return}el.innerHTML='<div class="table-wrap"><table><thead><tr><th>ID</th><th>状态</th><th>任务</th><th>步骤</th><th>模型</th><th>Tokens</th><th>耗时</th></tr></thead><tbody>'+data.slice(0,compact?8:100).map(r=>'<tr data-run="'+esc(r.id)+'"><td class="mono">'+esc(r.id)+'</td><td>'+status(r.status)+'</td><td>'+esc(r.task||'')+'</td><td>'+esc(r.steps||r.step_count||0)+'</td><td>'+esc(r.model||'—')+'</td><td>'+esc(r.tokens||r.total_tokens||0)+'</td><td>'+esc(r.duration_ms!=null?(r.duration_ms+' ms'):(r.duration||'—'))+'</td></tr>').join('')+'</tbody></table></div>';el.querySelectorAll('[data-run]').forEach(x=>x.onclick=()=>openRun(x.dataset.run))}
function status(s){const good=['done','completed','success','succeeded'].includes(String(s).toLowerCase());return '<span class="pill '+(good?'ok':String(s).toLowerCase()==='failed'?'bad':'')+'">'+esc(s||'—')+'</span>'}
async function loadPlugins(){const v=$('#view-plugins');v.innerHTML='<div class="empty">加载中…</div>';try{const rows=await api('/api/plugins');v.innerHTML='<div class="panel"><h2 class="section-title">插件目录 <button onclick="loadPlugins()">刷新</button></h2><div class="table-wrap"><table><thead><tr><th>名称</th><th>版本</th><th>状态</th><th>技能</th><th>描述</th></tr></thead><tbody>'+rows.map(p=>'<tr data-plugin="'+esc(p.name)+'"><td class="mono">'+esc(p.name)+'</td><td>'+esc(p.version)+'</td><td>'+status(p.loaded?'loaded':'unloaded')+'</td><td>'+esc(p.skill_count||0)+'</td><td>'+esc(p.description||'')+'</td></tr>').join('')+'</tbody></table></div><div id="pluginDetail"></div></div>';v.querySelectorAll('[data-plugin]').forEach(x=>x.onclick=()=>openPlugin(x.dataset.plugin))}catch(e){v.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
function fieldValue(v){if(typeof v==='boolean')return '<label class="inline"><input type="checkbox" data-cfg-type="boolean" '+(v?'checked':'')+'> 启用</label>';if(typeof v==='number')return '<input type="number" data-cfg-type="number" value="'+esc(v)+'">';if(v&&typeof v==='object')return '<textarea data-cfg-type="json">'+esc(JSON.stringify(v,null,2))+'</textarea>';return '<input data-cfg-type="string" value="'+esc(v)+'">'}
async function openPlugin(name){try{const d=await api('/api/plugins/'+encodeURIComponent(name));state.plugin=d;$('#pluginDetail').innerHTML='<div class="detail panel"><h3>插件：<span class="mono">'+esc(d.name)+'</span></h3><p class="muted">'+esc(d.description||'')+'</p><div class="form-grid" id="configFields">'+Object.entries(d.config||{}).map(([k,val])=>'<div class="field"><label>'+esc(k)+(val==='***'?'（已遮罩，不会修改）':'')+'</label><div data-cfg-key="'+esc(k)+'" data-masked="'+(val==='***')+'">'+fieldValue(val)+'</div></div>').join('')+'</div><div class="actions"><button class="primary" id="saveConfig">保存配置</button><button class="danger" id="reloadPlugin">重载插件</button></div></div>';$('#saveConfig').onclick=savePlugin;$('#reloadPlugin').onclick=async()=>{try{await api('/api/plugins/'+encodeURIComponent(name)+'/reload',{method:'POST'});toast('重载成功');loadPlugins()}catch(e){toast(e.message,true)}}}catch(e){toast(e.message,true)}}
async function savePlugin(){const config={};document.querySelectorAll('[data-cfg-key]').forEach(w=>{if(w.dataset.masked==='true')return;const i=w.querySelector('input,textarea');let v;if(i.dataset.cfgType==='boolean')v=i.checked;else if(i.dataset.cfgType==='number')v=Number(i.value);else if(i.dataset.cfgType==='json'){try{v=JSON.parse(i.value)}catch(e){throw new Error('JSON 配置格式错误：'+w.dataset.cfgKey)}}else v=i.value;config[w.dataset.cfgKey]=v});try{await api('/api/plugins/'+encodeURIComponent(state.plugin.name)+'/config',{method:'PUT',body:JSON.stringify({config})});toast('保存成功')}catch(e){toast(e.message,true)}}
async function loadSkills(){const v=$('#view-skills');v.innerHTML='<div class="empty">加载中…</div>';try{state.skills=await api('/api/skills');v.innerHTML='<div class="panel"><h2 class="section-title">技能目录 <button onclick="loadSkills()">刷新</button></h2><div class="toolbar"><input id="skillSearch" placeholder="搜索名称或摘要"><select id="skillPlugin"><option value="">全部插件</option></select><input id="skillTag" placeholder="标签"><button id="skillFilter">筛选</button></div><div id="skillTable"></div><div id="skillDetail"></div></div>';const sel=$('#skillPlugin');[...new Set(state.skills.map(x=>x.plugin).filter(Boolean))].sort().forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;sel.appendChild(o)});renderSkills();$('#skillFilter').onclick=renderSkills;$('#skillSearch').onkeydown=e=>{if(e.key==='Enter')renderSkills()}}catch(e){v.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
function renderSkills(){const q=($('#skillSearch')?.value||'').toLowerCase(),p=$('#skillPlugin')?.value||'',t=($('#skillTag')?.value||'').toLowerCase();const rows=state.skills.filter(s=>(!q||JSON.stringify(s).toLowerCase().includes(q))&&(!p||s.plugin===p)&&(!t||JSON.stringify(s.tags||[]).toLowerCase().includes(t)));$('#skillTable').innerHTML='<div class="table-wrap"><table><thead><tr><th>名称</th><th>插件</th><th>摘要</th><th>副作用</th><th>调用</th><th>错误</th><th>平均 ms</th><th>启用</th></tr></thead><tbody>'+rows.map(s=>'<tr data-skill="'+esc(s.name)+'"><td class="mono">'+esc(s.name)+'</td><td>'+esc(s.plugin||'')+'</td><td>'+esc(s.summary||'')+'</td><td>'+esc(Array.isArray(s.side_effects)?s.side_effects.join('、'):(s.side_effects||''))+'</td><td>'+esc(s.calls||0)+'</td><td>'+esc(s.errors||0)+'</td><td>'+esc(s.avg_ms||s.avg_duration_ms||0)+'</td><td><label class="switch"><input type="checkbox" data-toggle="'+esc(s.name)+'" '+(s.enabled?'checked':'')+'><i class="slider"></i></label></td></tr>').join('')+'</tbody></table></div>';$('#skillTable').querySelectorAll('[data-skill]').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-toggle]'))return;openSkill(x.dataset.skill)});$('#skillTable').querySelectorAll('[data-toggle]').forEach(x=>x.onchange=()=>toggleSkill(x.dataset.toggle,x.checked))}
async function toggleSkill(name,enabled){try{await api('/api/skills/'+encodeURIComponent(name),{method:'PUT',body:JSON.stringify({enabled})});toast(enabled?'技能已启用':'技能已停用')}catch(e){toast(e.message,true);renderSkills()}}
async function openSkill(name){try{const d=await api('/api/skills/'+encodeURIComponent(name));state.skill=d;const props=d.parameters&&d.parameters.properties||{};$('#skillDetail').innerHTML='<div class="detail panel"><h3>技能：<span class="mono">'+esc(d.name)+'</span></h3><p>'+esc(d.description||d.summary||'')+'</p><div class="subhead">JSON Schema</div><pre class="pre">'+esc(JSON.stringify(d.parameters||{},null,2))+'</pre><div class="subhead">测试调用</div><div class="form-grid" id="skillCtx"><div class="field"><label>group_id</label><input data-ctx="group_id" placeholder="群号，可空"></div><div class="field"><label>user_id</label><input data-ctx="user_id" placeholder="QQ号，可空"></div></div><div class="form-grid" id="skillArgs">'+Object.entries(props).map(([k,s])=>'<div class="field"><label>'+esc(k)+(Array.isArray(d.parameters&&d.parameters.required)&&d.parameters.required.includes(k)?' *':'')+'</label>'+argInput(k,s)+'</div>').join('')+'</div><div class="actions"><button class="primary" id="invokeSkill">调用技能</button></div><div id="invokeResult"></div></div>';$('#invokeSkill').onclick=invokeSkill}catch(e){toast(e.message,true)}}
function argInput(k,s){const typ=s.type||'string',attr='data-arg-key="'+esc(k)+'" data-arg-type="'+esc(typ)+'"';if(typ==='boolean')return '<label class="inline"><input type="checkbox" '+attr+'> 是</label>';if(typ==='object'||typ==='array')return '<textarea '+attr+' placeholder="'+esc(typ==='array'?'JSON 数组':'JSON 对象')+'"></textarea>';return '<input '+attr+' type="'+(typ==='integer'||typ==='number'?'number':'text')+'">'}
async function invokeSkill(){const args={};try{document.querySelectorAll('[data-arg-key]').forEach(i=>{const typ=i.dataset.argType;let v=typ==='boolean'?i.checked:i.value;if(v!==''&&(typ==='integer'||typ==='number'))v=typ==='integer'?parseInt(v,10):parseFloat(v);if((typ==='object'||typ==='array')&&v!=='')v=JSON.parse(v);if(v!==''||typ==='boolean')args[i.dataset.argKey]=v});const payload={arguments:args};document.querySelectorAll('[data-ctx]').forEach(i=>{const v=i.value.trim();if(v)payload[i.dataset.ctx]=v});const d=await api('/api/skills/'+encodeURIComponent(state.skill.name)+'/invoke',{method:'POST',body:JSON.stringify(payload)});$('#invokeResult').innerHTML='<div class="subhead">调用结果</div><pre class="pre">'+esc(JSON.stringify(d,null,2))+'</pre>';toast(d.ok===false?'调用失败':'调用完成',d.ok===false)}catch(e){toast(e.message,true)}}
async function loadAgent(){const v=$('#view-agent');v.innerHTML='<div class="grid2"><div class="panel"><h2 class="section-title">手动运行</h2><form id="runForm"><div class="field"><label>任务</label><textarea id="runTask" required style="min-height:130px;width:100%" placeholder="输入要交给 Agent 的任务"></textarea></div><div class="field" style="margin-top:10px"><label>session_key</label><input id="sessionKey" value="admin"></div><div class="actions"><button class="primary" id="runSubmit">开始运行</button></div></form></div><div class="panel"><h2 class="section-title">运行说明</h2><p class="muted">请求会等待 Agent 运行结束后返回。运行记录每 5 秒自动刷新。</p><div id="runDetail"></div></div></div><div class="panel" style="margin-top:16px"><h2 class="section-title">运行记录 <button onclick="refreshRuns()">刷新</button></h2><div id="runsTable"></div></div>';$('#runForm').onsubmit=submitRun;refreshRuns();clearInterval(state.poll);state.poll=setInterval(refreshRuns,5000)}
async function refreshRuns(){try{state.runs=await api('/api/runs?limit=100');renderRuns(state.runs,'#runsTable')}catch(e){const el=$('#runsTable');if(el&&!el.innerHTML)el.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
async function submitRun(e){e.preventDefault();const b=$('#runSubmit');b.disabled=true;b.innerHTML='<span class="spinner"></span> 运行中';try{const d=await api('/api/agent/run',{method:'POST',body:JSON.stringify({task:$('#runTask').value,session_key:$('#sessionKey').value||'admin'})});toast('运行完成');await refreshRuns();openRun(d.id)}catch(err){toast(err.message,true)}finally{b.disabled=false;b.textContent='开始运行'}}
async function openRun(id){if(!$('#runDetail')){state.route='agent';location.hash='agent';setView()}try{const d=await api('/api/runs/'+encodeURIComponent(id));state.run=d;const steps=d.steps||[];const msgs=d.messages||d.transcript||[];$('#runDetail').innerHTML='<div class="detail"><div class="metric">'+esc(d.result||d.error||d.summary||d.task||'')+'</div><div class="actions"><button class="danger" id="cancelRun">取消运行</button></div><div class="subhead">步骤时间线</div><div class="timeline">'+(steps.length?steps.map(s=>'<div class="step '+(s.ok===false?'fail':'')+'"><b>'+esc(s.tool||s.name||'step')+'</b> <span class="metric">'+esc(s.ms||s.duration_ms||'—')+' ms</span><div>'+esc(s.content||s.error||'')+'</div></div>').join(''):'<div class="muted">暂无步骤</div>')+'</div><div class="subhead">消息记录</div><div class="transcript">'+(msgs.length?msgs.map(m=>'<div class="message"><span class="role">'+esc(m.role||'')+'</span><div>'+esc(m.content||'')+'</div>'+(m.tool_calls?'<div class="metric">工具：'+esc(m.tool_calls.map(x=>x.name||x.function?.name||'').join('、'))+'</div>':'')+'</div>').join(''):'<div class="muted">暂无消息</div>')+'</div></div>';$('#cancelRun').onclick=()=>cancelRun(id)}catch(e){toast(e.message,true)}}
async function cancelRun(id){try{await api('/api/runs/'+encodeURIComponent(id)+'/cancel',{method:'POST'});toast('已发送取消请求');openRun(id);refreshRuns()}catch(e){toast(e.message,true)}}
async function loadAudit(){const v=$('#view-audit');v.innerHTML='<div class="panel"><h2 class="section-title">审计日志</h2><div class="tabs"><button class="'+(state.auditTab==='skills'?'active':'')+'" data-audit="skills">技能调用</button><button class="'+(state.auditTab==='actions'?'active':'')+'" data-audit="actions">管理操作</button></div><div id="auditTable"></div></div>';v.querySelectorAll('[data-audit]').forEach(x=>x.onclick=()=>{state.auditTab=x.dataset.audit;loadAudit()});try{const d=await api('/api/audit?limit=200');const rows=d[state.auditTab]||[];$('#auditTable').innerHTML='<div class="table-wrap"><table><thead><tr><th>时间</th><th>'+(state.auditTab==='skills'?'技能':'操作')+'</th><th>操作人</th><th>结果</th><th>耗时</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(fmtDate(x.ts||x.time))+'</td><td class="mono">'+esc(x.skill||x.action||'')+'</td><td>'+esc(x.operator||'')+'</td><td>'+status(x.ok===false?'error':'ok')+(x.error?'<div class="muted">'+esc(x.error)+'</div>':'')+'</td><td>'+esc(x.ms||x.duration_ms||'—')+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){$('#auditTable').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
$('#loginForm').onsubmit=e=>{e.preventDefault();const t=$('#tokenInput').value.trim();if(!t)return;state.token=t;localStorage.setItem('ncatbot_admin_token',t);hideLogin();setView()};
initNav();if(state.token)setView();else{setView();showLogin()}
</script>
</body>
</html>
