version: '3.8'

services:
  napcat:
    image: mlikiowa/napcat-docker:pr-1768-e310a57
    container_name: napcat
    restart: always
    ports:
      - "6099:6099"
      - "3001:3001"
    environment:
      - NAPCAT_GID=0
      - NAPCAT_UID=0
      - WEBUI_TOKEN=napcat
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/QQ:/app/.config/QQ
