# docker-compose.yml
version: "3"
services:
    napcat:
        environment:
            - NAPCAT_UID=9999 
            - NAPCAT_GID=9999
        ports:
            - 3000:3000
            - 3002:3002
            - 6099:6099
        container_name: napcat
        network_mode: bridge
        restart: always
        image: mlikiowa/napcat-docker:latest