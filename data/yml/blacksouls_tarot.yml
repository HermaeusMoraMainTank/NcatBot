tarot:
  - name: 爱丽丝
    positive: "……有谁在呼唤着你，\n惹人怜爱的，绮丽的，微微带着一种透明感的声音，\n传递到了你的耳朵里。\n「ーーーーーーーーーー」\n……啊啊，你听过这声音。\n从久眠中苏醒而来的意识，\n逐渐开始变得清醒了起来。\n对，在你身边的就是属于你的……"
    negative: ""
    imageName: 爱丽丝.jpg
  - name: 奈丽丝
    positive: "闪耀的群星将光辉洒在两人身上。\n可那几乎要将瞳孔灼伤一般的光辉\n并不是祝福，反而更像是因嫉妒而燃起的焦虑。\n突然，注意到了什么而不由得止住了步伐。\n……为何到现在都没有发觉呢。\n───爱丽丝到底在哪里？"
    negative: ""
    imageName: 奈丽丝.jpg
  - name: 白兔诺登
    positive: "我从心底里爱着您。正因如此一我才要抽身而出\n而我的结局，并非是不幸的"
    negative: ""
    imageName: 白兔诺登.jpeg
  - name: 芋虫希夏
    positive: "噗啪噗啪噗啪。\n变成泡沫飞走了。\n被你所触碰的话就会破碎消失呢，我的梦"
    negative: ""
    imageName: 芋虫希夏.jpg
  - name: 贾布加布
    positive: "野兽们在发着情！花儿们在发狂一般的生长着！\n来开始这暴虐而又狂乱的宴会吧！\n用你的死祭奠这不思议之国吧！"
    negative: ""
    imageName: 贾布加布.jpg
  - name: 贾巴沃克
    positive: "……吾乃邪龙贾巴沃克。支离破碎的夸大妄想之存在。\n勇士啊，拿起你的剑\n于此刻再一次，斩下我的首级来魅住我吧…！"
    negative: ""
    imageName: 贾巴沃克.jpg 